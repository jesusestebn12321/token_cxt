      {
        "success": true,
        "data": {
          "secret": "<base32>",
          "otpauthUrl": "otpauth://totp/RWA%20Exchange%20Backoffice:admin@exchange.com?secret=<base32>&issuer=RWA%20Exchange%20Backoffice"
        },
        "timestamp": "2026-10-27T00:00:00.000Z"
      }
