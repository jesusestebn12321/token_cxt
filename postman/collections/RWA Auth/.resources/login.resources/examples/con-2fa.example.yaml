$kind: http-example
name: Con 2FA
order: 2000
request:
  method: POST
  url: '{{baseUrl}}/auth/login'
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "requiresTwoFactor": true,
          "twoFactorToken": "<jwt>"
        },
        "timestamp": "2026-10-27T00:00:00.000Z"
      }
