$kind: http-example
name: Rotación
order: 1000
request:
  method: POST
  url: '{{baseUrl}}/auth/refresh'
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "accessToken": "<jwt>",
          "refreshToken": "<jwt>"
        },
        "timestamp": "2026-10-27T00:00:00.000Z"
      }
