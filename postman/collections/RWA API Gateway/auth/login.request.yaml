$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/auth/login'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
examples: './.resources/login.resources/examples'
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      pm.test('login del super admin sin 2FA', function () {
        pm.response.to.have.status(200);
        const data = pm.response.json().data;
        pm.expect(data.requiresTwoFactor).to.eql(false);
        pm.expect(data.accessToken).to.be.a('string').and.not.empty;
        pm.expect(data.refreshToken).to.be.a('string').and.not.empty;
      });
