$kind: http-example
name: Sesión válida
order: 1000
request:
  method: GET
  url: '{{baseUrl}}/auth/me'
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": "<objectId>",
          "email": "admin@exchange.com",
          "roles": ["SUPER_ADMIN"],
          "permissions": ["users:read", "users:create", "users:update", "users:delete"],
          "twoFactorVerified": false
        },
        "timestamp": "2026-10-27T00:00:00.000Z"
      }
