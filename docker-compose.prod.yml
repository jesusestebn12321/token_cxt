services:
  api:
    image: ${API_IMAGE:-ghcr.io/jesusestebn12321/token_cxt:latest}
    build: !reset null
    environment:
      SWAGGER_ENABLED: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  seed:
    image: ${API_IMAGE:-ghcr.io/jesusestebn12321/token_cxt:latest}
    build: !reset null
