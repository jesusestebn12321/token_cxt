services:
  mongo:
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

  api:
    build:
      context: .
      target: dev
    image: rwa-backoffice:dev
    command: ["npm", "run", "start:dev"]
    environment:
      NODE_ENV: development
      SWAGGER_ENABLED: "true"
      TSC_WATCHFILE: PriorityPollingInterval
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./nest-cli.json:/app/nest-cli.json:ro
      - /app/node_modules
