# Stack completo: MongoDB (replica set con auth) + API.
#   Producción local : docker compose up -d --build
#   Desarrollo       : docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   Seed (roles+admin): docker compose --profile tools run --rm seed
# Las variables se leen de `.env` (ver .env.example, sección Docker).
name: rwa-backoffice

x-app-env: &app-env
  NODE_ENV: production
  PORT: 3000
  API_PREFIX: api
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  THROTTLE_TTL: ${THROTTLE_TTL:-60000}
  THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
  # Atención: si la contraseña tiene caracteres especiales hay que codificarla (URL-encode)
  MONGODB_URI: mongodb://${MONGO_APP_USER:-rwa_app}:${MONGO_APP_PASSWORD:?Define MONGO_APP_PASSWORD en .env}@mongo:27017/${MONGO_DB:-rwa_backoffice}?replicaSet=rs0&authSource=${MONGO_DB:-rwa_backoffice}
  MONGODB_AUTO_INDEX: ${MONGODB_AUTO_INDEX:-true}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET (mín. 32 caracteres) en .env}
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET (mín. 32 caracteres) en .env}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  JWT_TWO_FACTOR_EXPIRES_IN: ${JWT_TWO_FACTOR_EXPIRES_IN:-5m}
  TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-RWA Exchange Backoffice}
  EVM_DEFAULT_CHAIN_ID: ${EVM_DEFAULT_CHAIN_ID:-11155111}
  EVM_RPC_URL: ${EVM_RPC_URL:-}

services:
  # Genera (una sola vez) el keyfile que exige MongoDB para replica set + autenticación
  mongo-keyfile:
    image: mongo:8
    restart: "no"
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /keyfile/mongo-keyfile ] || openssl rand -base64 756 > /keyfile/mongo-keyfile
        chown 999:999 /keyfile/mongo-keyfile && chmod 400 /keyfile/mongo-keyfile
    volumes:
      - mongo_keyfile:/keyfile

  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--replSet", "rs0", "--keyFile", "/keyfile/mongo-keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}
      MONGO_DB: ${MONGO_DB:-rwa_backoffice}
      MONGO_APP_USER: ${MONGO_APP_USER:-rwa_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Define MONGO_APP_PASSWORD en .env}
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/keyfile:ro
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    # Inicia el replica set la primera vez y solo se declara "healthy" cuando hay PRIMARY
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval
          "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      target: production
    image: rwa-backoffice:latest
    restart: unless-stopped
    init: true # reenvía señales y limpia procesos zombi (apagado ordenado)
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      <<: *app-env
    ports:
      - "${API_PORT:-3000}:3000"

  # Tarea puntual: roles/permisos + super admin inicial
  seed:
    profiles: ["tools"]
    image: rwa-backoffice:latest
    build:
      context: .
      target: production
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command: ["node", "dist/database/seeds/run-seed.js"]
    environment:
      <<: *app-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@exchange.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

volumes:
  mongo_data:
  mongo_keyfile:
