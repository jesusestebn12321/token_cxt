name: rwa-backoffice

x-app-env: &app-env
  NODE_ENV: production
  PORT: 3000
  API_PREFIX: api
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  THROTTLE_TTL: ${THROTTLE_TTL:-60000}
  THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
  DATABASE_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:?}@mongo:27017/${MONGO_DB:-rwa_backoffice}?authSource=admin&replicaSet=rs0
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  JWT_TWO_FACTOR_EXPIRES_IN: ${JWT_TWO_FACTOR_EXPIRES_IN:-5m}
  TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-RWA Exchange Backoffice}
  AUTH_EXPOSE_RESET_TOKEN: ${AUTH_EXPOSE_RESET_TOKEN:-false}

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    # Mongo 8 exige keyFile si hay auth y replica set. Se genera en el volumen, con modo 400.
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /data/configdb
        if [ ! -s /data/configdb/keyfile ]; then
          head -c 96 /dev/urandom | base64 -w 0 > /data/configdb/keyfile
        fi
        chown mongodb:mongodb /data/configdb/keyfile
        chmod 400 /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/configdb/keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval
          "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      target: production
    image: rwa-backoffice:latest
    restart: unless-stopped
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      <<: *app-env
    ports:
      - "${API_PORT:-3000}:3000"

  seed:
    profiles: ["tools"]
    image: rwa-backoffice:latest
    build:
      context: .
      target: production
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command: ["node", "dist/database/seeds/run-seed.js"]
    environment:
      <<: *app-env

volumes:
  mongo_data:
